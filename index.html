<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Generador de Portadas — Reels</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,800;1,700;1,800&family=Inter:wght@400;500;600;700;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:'Inter',sans-serif;
    background:#0b0e16;
    color:#fff;
    min-height:100vh;
    display:flex; flex-direction:column; align-items:center;
    padding:32px 16px 64px;
  }
  h1{ font-size:22px; font-weight:800; margin-bottom:6px; }
  .hint{ color:rgba(255,255,255,0.55); font-size:14px; margin-bottom:28px; text-align:center; max-width:420px; }

  .panel{
    width:100%; max-width:420px; display:flex; flex-direction:column; gap:14px; margin-bottom:28px;
  }
  label{ font-size:13px; font-weight:700; color:#E3BA75; text-transform:uppercase; letter-spacing:0.06em; display:block; margin-bottom:6px; }
  textarea, input[type=text]{
    width:100%; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.16);
    border-radius:10px; padding:12px 14px; color:#fff; font-family:'Inter',sans-serif; font-size:16px;
    resize:vertical;
  }
  textarea{ min-height:84px; }
  textarea:focus, input:focus{ outline:2px solid #C9973A; }

  .frame-wrap{
    width:100%; max-width:340px; aspect-ratio:9/16;
    border-radius:18px; overflow:hidden; position:relative;
    box-shadow:0 30px 60px -20px rgba(0,0,0,0.7);
    margin-bottom:28px;
  }
  .frame-inner{ width:100%; height:100%; overflow:hidden; position:relative; }

  .stage{
    width:1080px; height:1920px;
    position:relative;
    background:linear-gradient(160deg,#21356b 0%,#131f42 45%,#05070d 100%);
    transform-origin: top left;
  }
  .stage::after{
    content:""; position:absolute; inset:0;
    background: radial-gradient(circle at 85% 10%, rgba(201,151,58,0.22), transparent 55%);
    pointer-events:none;
  }
  .logo-badge{
    position:absolute; top:56px; left:76px; z-index:2;
    display:inline-flex; align-items:center;
    background:#fff; border-radius:12px; padding:10px 16px;
    box-shadow:0 10px 24px -10px rgba(0,0,0,0.4);
  }
  .logo-badge img{ height:38px; width:auto; display:block; }

  .crop-guide{
    position:absolute; left:0; right:0; z-index:1;
    top:420px; height:1080px;
    border-top:2px dashed rgba(255,255,255,0.18);
    border-bottom:2px dashed rgba(255,255,255,0.18);
    pointer-events:none;
  }

  .center-wrap{
    position:absolute; inset:0; z-index:2;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:0 90px; text-align:center;
  }
  .eyebrow{
    display:inline-flex; align-items:center; gap:12px;
    font-size:26px; font-weight:700; letter-spacing:0.16em; text-transform:uppercase;
    color:#E3BA75; margin-bottom:32px; min-height:1px;
  }
  .eyebrow::before, .eyebrow::after{ content:""; width:34px; height:3px; background:#E3BA75; display:inline-block; }
  .eyebrow:empty{ display:none; margin:0; }

  h1.headline{
    font-family:'Playfair Display',serif; font-weight:800; font-style:italic;
    font-size:92px; line-height:1.18; color:#fff; letter-spacing:-0.01em;
    max-width:900px; white-space:pre-wrap;
  }

  .footer-tag{
    position:absolute; bottom:64px; left:76px; right:76px; z-index:2;
    display:flex; align-items:center; justify-content:center; gap:10px;
    font-size:26px; color:rgba(255,255,255,0.5); font-weight:600;
  }
  .footer-tag .dot{ color:#E3BA75; }

  button#download{
    width:100%; max-width:340px;
    background:#C9973A; color:#15203f; font-weight:800; font-size:17px;
    padding:16px 24px; border:none; border-radius:999px; cursor:pointer;
    box-shadow:0 20px 40px -16px rgba(201,151,58,0.6);
  }
  button#download:active{ transform:translateY(1px); }
  button#download:disabled{ opacity:0.6; cursor:wait; }

  .toggle-guide{
    font-size:13px; color:rgba(255,255,255,0.55); margin-bottom:16px; cursor:pointer; user-select:none;
  }
  .toggle-guide input{ margin-right:6px; vertical-align:middle; }

  .status{ font-size:13px; color:rgba(255,255,255,0.5); margin-top:10px; min-height:18px; }
</style>
</head>
<body>
  <h1>Generador de portadas — Reels</h1>
  <p class="hint">Escribe el título del reel, mira la vista previa y descarga la imagen lista para subir como portada (1080×1920). Puedes volver a usar esta misma página cada vez — no necesitas guardar nada nuevo.</p>

  const status = document.getElementById('status');

  function syncText() {
    headlineText.textContent = titleInput.value || '';
    eyebrowText.textContent = eyebrowInput.value || '';
  }
  titleInput.addEventListener('input', syncText);
  eyebrowInput.addEventListener('input', syncText);
  syncText();

  guideToggle.addEventListener('change', () => {
    cropGuide.style.display = guideToggle.checked ? 'block' : 'none';
  });

  function fitStage() {
    const scale = frameInner.clientWidth / 1080;
    stage.style.transform = 'scale(' + scale + ')';
  }
  window.addEventListener('resize', fitStage);
  fitStage();

  function slugify(text) {
    return (text || 'portada')
      .toLowerCase()
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .replace(/[^a-z0-9]+/g, '-')
      .replace(/(^-|-$)/g, '')
      .slice(0, 60) || 'portada';
  }

  downloadBtn.addEventListener('click', async () => {
    downloadBtn.disabled = true;
    status.textContent = 'Generando imagen...';
    const wasGuideVisible = cropGuide.style.display === 'block';
    cropGuide.style.display = 'none';

    const clone = stage.cloneNode(true);
    clone.style.transform = 'none';
    const offscreen = document.createElement('div');
    offscreen.style.position = 'fixed';
    offscreen.style.left = '-10000px';
    offscreen.style.top = '0';
    offscreen.style.width = '1080px';
    offscreen.style.height = '1920px';
    offscreen.appendChild(clone);
    document.body.appendChild(offscreen);

    try {
      await document.fonts.ready;
      const canvas = await html2canvas(clone, { width: 1080, height: 1920, scale: 1, backgroundColor: null });
      canvas.toBlob((blob) => {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'portada-' + slugify(titleInput.value) + '.png';
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
        status.textContent = 'Listo — revisa tu carpeta de descargas.';
      }, 'image/png');
    } catch (err) {
      status.textContent = 'Hubo un error generando la imagen: ' + err.message;
      console.error(err);
    } finally {
      document.body.removeChild(offscreen);
      cropGuide.style.display = wasGuideVisible ? 'block' : 'none';
      downloadBtn.disabled = false;
    }
  });
</script>
</body>
</html>
